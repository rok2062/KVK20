<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2062 戦力ウォッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#11161C; --surface:#1A2129; --surface-2:#202932; --ink:#E4E9EE; --muted:#97A3AF; --line:#2B353F; --line-strong:#3D4954;
  --accent:#6FB1DF; --accent-ink:#0E1A26; --accent-soft:#1B3040;
  --down:#F08A7C; --down-soft:#3A201D; --up:#7BD39A; --up-soft:#193324; --flat:#A2ACB6; --flat-soft:#2A323B; --absent:#F0B45A; --absent-soft:#3A2D14;
  --sub:#B7A6EE; --sub-soft:#2B2540;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#1B2430; --muted:#5D6873; --line:#D5DBE2; --line-strong:#B8C1CB;
  --accent:#1D5C8A; --accent-ink:#FFFFFF; --accent-soft:#E3EEF7;
  --down:#B93A2E; --down-soft:#F9E5E2; --up:#1F7A45; --up-soft:#E2F3E8; --flat:#6B7580; --flat-soft:#EAEDF0; --absent:#A86A0C; --absent-soft:#FBEFD9;
  --sub:#5B4B9E; --sub-soft:#ECE8F7;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
*{box-sizing:border-box}
html{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
header{max-width:1500px;margin:0 auto;padding-block:20px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.periods{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.theme{appearance:none;font:inherit;font-size:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;align-self:center}
.theme:hover{border-color:var(--accent);color:var(--accent)}
.period{display:flex;flex-direction:column;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:132px}
.period b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.period span{font-size:12px;color:var(--muted)}
.period em{font-style:normal;font-size:12px;color:var(--ink)}
main{max-width:1500px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.controls:first-child{border-radius:8px 8px 0 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.group-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input,.field select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:5px 8px;min-height:32px}
.field input[type=number]{width:96px;font-family:"IBM Plex Mono",monospace}
.field input[type=search]{width:180px}
.range{display:flex;align-items:center;gap:4px}
.range span{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink);font:inherit;padding:5px 10px;cursor:pointer;border-right:1px solid var(--line-strong);min-height:32px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:6px;min-height:32px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent)}
.actions{margin-left:auto;display:flex;gap:8px;align-items:flex-end}
.btn{appearance:none;font:inherit;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:5px 12px;cursor:pointer;min-height:32px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.summary b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}
.tablewrap{overflow:auto;max-height:76vh;border-radius:0 0 8px 8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);padding:6px 10px;text-align:left;font-weight:500;color:var(--muted);white-space:nowrap;font-size:12px}
thead tr.grp th{top:0;border-bottom:1px solid var(--line);text-align:center;font-weight:700;color:var(--ink);padding:5px 10px;letter-spacing:.04em}
thead tr.col th{top:29px;border-bottom:1px solid var(--line-strong);cursor:pointer;user-select:none}
thead th.num,td.num,tfoot td.num{text-align:right}
thead th[aria-sort="ascending"]::after{content:" ▲";color:var(--accent)}
thead th[aria-sort="descending"]::after{content:" ▼";color:var(--accent)}
th.gl,td.gl{border-left:1px solid var(--line)}
td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
td.name{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.id{color:var(--muted);font-size:12px;font-family:"IBM Plex Mono",monospace}
td.num,tfoot td.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
td.sub-of{color:var(--muted);font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
tfoot td{position:sticky;bottom:0;background:var(--surface-2);border-top:2px solid var(--line-strong);padding:7px 10px;font-weight:500;white-space:nowrap;z-index:1}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:18px}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.flat{background:var(--flat-soft);color:var(--flat)}
.pill.absent{background:var(--absent-soft);color:var(--absent)}
.pill.main{background:var(--accent-soft);color:var(--accent)}
.pill.sub{background:var(--sub-soft);color:var(--sub)}
.delta.down{color:var(--down)}.delta.up{color:var(--up)}.delta.flat{color:var(--muted)}
.absent-cell{color:var(--absent);font-weight:500}
.zero{color:var(--down);font-weight:500}
.lowd{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums}
.kingdom{margin-bottom:12px}
.kingdom .khead{padding:8px 16px;font-weight:700;border-bottom:1px solid var(--line);font-size:13px}
.kingdom table{width:auto;min-width:0}
.kingdom th,.kingdom td{padding:5px 14px}
.kingdom thead th{position:static;cursor:default;vertical-align:bottom;line-height:1.25}
.kingdom tbody th{text-align:left;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);padding:5px 14px;font-size:12px}
.kingdom tbody tr:last-child td,.kingdom tbody tr:last-child th{border-bottom:0}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
#status{max-width:1500px;margin:8px auto 0;font-size:12px;color:var(--muted)}
#status.err{color:var(--down)}
@media (max-width:640px){ .actions{margin-left:0} .tablewrap{max-height:none} }
@media (prefers-reduced-motion:no-preference){ .btn,.seg button{transition:color .12s,background-color .12s,border-color .12s} }
</style>

<script>
(function(){ let t='dark'; try{ t=localStorage.getItem('kvk-theme')||'dark'; }catch(e){} document.documentElement.setAttribute('data-theme',t); })();

<script>
// ===== 設定 =====================================================
// Googleスプレッドシートから直接読む場合はIDを入れる（共有設定を「リンクを知っている全員が閲覧可」にすること）。
// 空文字なら同じフォルダの data.js（build_data.py --book スプシ.xlsx で生成）を使う。
const CONFIG = {
  sheetId: '1P432N6b3gd0Pd4pM22EAUoVHnMZJhKVLO9bsBDK-1Co',
  sheets: { k19: 'KVK19', k20: 'KVK20', k19base: 'KVK19base', k20base: 'KVK20base', a19: 'AfterKVK19', a20: 'AfterKVK20', subs: 'サブ登録copy', now: '現在' },
  // KVK19/KVK20 の戦力・最高戦力は *base シート（KVKマッチング時のエクスポート）を優先し、撃破pt・戦死は KVK19/KVK20 シート（KVK期間の統計）から取る。
  // AfterKVK19 / AfterKVK20（KVK終了後）は王国全体の比較表にのみ使う。
  // base シートが無い／IDが無い場合は KVK19/KVK20 シートの戦力を使う。
  periods: { k19: '2026/04/10〜05/30', k20: '2026/07/06〜08/22' },
  // 日別シート: 「20260913」のように YYYYMMDD 名のシートを毎日追加すると、最新の日付シートを「現在」として扱う。
  dailyStart: '2026-09-12',   // この日から今日までの YYYYMMDD シートを探す
  dailyEnd: '',               // 空なら今日まで
  defaultTolerance: 10,       // 万 (「変化なし」判定の許容幅)
};

<script src="data.js"></script>

<header>
  <h1>2062 戦力ウォッチ <small>KVK19 / KVK20 / 現在 の戦力・撃破を1つのリストで比較</small></h1>
  <div class="periods"><span id="periods" class="periods"></span><button class="theme" id="themeBtn" type="button" title="ダーク／ライト切替">☀ ライト</button></div>

<main>
  <div class="panel kingdom">

      <div class="field"><label>KVK20→現在</label><div class="seg" id="fCh20"><button aria-pressed="true" data-v="all">全て</button><button aria-pressed="false" data-v="down">下げ</button><button aria-pressed="false" data-v="up">上げ</button><button aria-pressed="false" data-v="flat">変化なし</button><button aria-pressed="false" data-v="absent">不在</button></div></div>
      <div class="field"><label>変化なし ±（万）</label><input type="number" id="fTol" value="10" min="0" step="10"></div>
      <div class="field"><label>最低戦力の時点</label><div class="seg" id="fLow"><button aria-pressed="true" data-v="all">全て</button><button aria-pressed="false" data-v="now">現在</button><button aria-pressed="false" data-v="k20">KVK20</button><button aria-pressed="false" data-v="k19">KVK19</button></div></div>
      <label class="check"><input type="checkbox" id="fScope" checked>KVK19かKVK20に存在するアカウントのみ</label>
      <label class="check"><input type="checkbox" id="fShowNowAbsent" checked>現在不在も表示</label>
      <label class="check" id="dailyToggle" hidden><input type="checkbox" id="fDaily" checked>日別列を表示</label>
      <div class="actions"><button class="btn" id="btnReset">フィルター解除</button><button class="btn" id="btnCsv">CSV</button></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const MAN=10000;
const fmt=n=>n==null?'':n.toLocaleString('ja-JP');
const fmtD=n=>(n>0?'+':'')+fmt(n);
// 短縮表記: 1.23億 / 8,000万 / 1万未満はそのまま
function fmtS(n){ if(n==null) return ''; const a=Math.abs(n), sg=n<0?'-':'';
  if(a>=1e8) return sg+(a/1e8).toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2})+'億';
  if(a>=1e4) return sg+Math.round(a/1e4).toLocaleString('ja-JP')+'万';
  return sg+a.toLocaleString('ja-JP'); }
const fmtSD=n=>(n>0?'+':'')+fmtS(n);
const fmtDate=d=>`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;
const normId=v=>{ v=String(v??'').trim(); return v.endsWith('.0')?v.slice(0,-2):v; };
let DATA=null;

// ---------- 読み込み（Googleスプレッドシート） ----------
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else if(c!=='\r') f+=c; }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function fetchRows(name, required){
  // _=時刻 でキャッシュ回避（ブラウザ／中継のキャッシュで古いCSVが返るのを防ぐ）。name が空なら先頭シート
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&headers=1${name?`&sheet=${encodeURIComponent(name)}`:''}&_=${Date.now()}`;
  let res; try{ res=await fetch(url,{cache:'no-store'}); }catch(e){ if(required) throw new Error(`${name} シートを取得できません (${e.message})`); return null; }
  if(!res.ok){ if(required) throw new Error(`${name} シートを取得できません (${res.status})`); return null; }
  const text=await res.text(); const rows=parseCSV(text); if(!rows.length) return null; rows.text=text; return rows;
}
const num=v=>{const n=parseFloat(String(v??'').replace(/[,\s]/g,''));return isNaN(n)?0:Math.round(n);};
function statsFromRows(rows, name, required){
  if(!rows) return null;
  // 見出し行を先頭5行から探す（1行目に日付などが混ざると Google が見出し無しとして返すことがある）
  let hi=rows.slice(0,5).findIndex(r=>r.some(c=>String(c).trim()==='キャラクターID')); if(hi<0) hi=0;
  rows=rows.slice(hi);
  const h=rows[0].map(s=>String(s).trim()); const ix=n=>h.indexOf(n);
  const I={id:ix('キャラクターID'),name:ix('キャラクターニックネーム'),p:ix('現在の戦力'),max:ix('過去最大戦力'),kp:ix('撃破ポイント合計'),k5:ix('T5撃破合計'),k4:ix('T4撃破合計'),d5:ix('T5戦死'),d4:ix('T4戦死')};
  if(I.id<0||I.p<0){ if(required) throw new Error(`${name} シートの見出しが statsExport 形式ではありません`); return null; }
  const g=(r,k)=>I[k]>=0?num(r[I[k]]):0, out={};
  for(const r of rows.slice(1)){ const id=normId(r[I.id]); if(!id) continue;
    out[id]={name:(r[I.name]||'').trim(),p:g(r,'p'),max:g(r,'max'),kp:g(r,'kp'),k5:g(r,'k5'),k4:g(r,'k4'),dead:g(r,'d5')+g(r,'d4')}; }
  return out;
}
// 戦力は base、撃破/戦死は stats。stats に無いIDは撃破・戦死 null（不明）
function mergeBase(stats, base){
  if(!base) return stats;
  const out={};
  for(const id of new Set([...Object.keys(stats),...Object.keys(base)])){
    const st=stats[id], b=base[id];
    out[id]={name:(b||st).name, p:(b||st).p, max:(b||st).max, kp:st?st.kp:null, k5:st?st.k5:null, k4:st?st.k4:null, dead:st?st.dead:null, src:b?'base':'stats'};
  }
  return out;
}
function dateRange(){
  const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,'');
  const a=new Date(CONFIG.dailyStart+'T00:00:00Z'), b=CONFIG.dailyEnd?new Date(CONFIG.dailyEnd+'T00:00:00Z'):new Date(Date.now()+9*3600e3);
  const out=[]; for(let d=a; ymd(d)<=ymd(b)&&out.length<120; d=new Date(d.getTime()+86400e3)) out.push(ymd(d)); return out;
}
async function loadFromSheet(){
  const st=$('#status'); st.textContent='スプレッドシートを読み込み中…';
  const dates=dateRange();
  let [rFirst,r19,r20,b19,b20,ra19,ra20,rSubs,...rDaily]=await Promise.all([fetchRows(null,false),fetchRows(CONFIG.sheets.k19,true),fetchRows(CONFIG.sheets.k20,true),fetchRows(CONFIG.sheets.k19base,false),fetchRows(CONFIG.sheets.k20base,false),fetchRows(CONFIG.sheets.a19,false),fetchRows(CONFIG.sheets.a20,false),fetchRows(CONFIG.sheets.subs,false),...dates.map(d=>fetchRows(d,false))]);
  // 存在しないシート名を指定すると Google は先頭シートの内容を返してしまうので、先頭シートと同一内容のものは「無い」扱いにする。
  // 日付シートは先頭シートそのものである可能性があるため、同一内容のうち最も古い日付だけ残す。
  const same=r=>!!(r&&rFirst&&r.text===rFirst.text);
  if(same(b19)) b19=null; if(same(b20)) b20=null; if(same(ra19)) ra19=null; if(same(ra20)) ra20=null; if(same(rSubs)) rSubs=null;
  { let kept=false; rDaily=rDaily.map(r=>{ if(!same(r)) return r; if(kept) return null; kept=true; return r; }); }
  const a19=statsFromRows(ra19,CONFIG.sheets.a19,false)||{}, a20=statsFromRows(ra20,CONFIG.sheets.a20,false)||{};
  const s19=statsFromRows(r19,CONFIG.sheets.k19,true), s20=statsFromRows(r20,CONFIG.sheets.k20,true);
  const sb19=statsFromRows(b19,CONFIG.sheets.k19base,false), sb20=statsFromRows(b20,CONFIG.sheets.k20base,false);
  const k19=mergeBase(s19,sb19), k20=mergeBase(s20,sb20);
  const cnt=o=>o?Object.keys(o).length+'件':'見つからず';
  const loaded=`${CONFIG.sheets.k19} ${cnt(s19)} / ${CONFIG.sheets.k19base} ${cnt(sb19)} / ${CONFIG.sheets.a19} ${cnt(ra19&&a19)} / ${CONFIG.sheets.k20} ${cnt(s20)} / ${CONFIG.sheets.k20base} ${cnt(sb20)} / ${CONFIG.sheets.a20} ${cnt(ra20&&a20)} / ${CONFIG.sheets.subs} ${rSubs?rSubs.length-1+'件':'見つからず'}`;
  const warn=(!sb19||!sb20)?`【注意】${!sb19?CONFIG.sheets.k19base:''}${!sb19&&!sb20?'・':''}${!sb20?CONFIG.sheets.k20base:''} シートを取得できないため KVK19/KVK20 シートの戦力を使用中。シート名と共有設定を確認してください。`:'';
  const daily={}; rDaily.forEach((r,i)=>{ const s=statsFromRows(r,dates[i],false); if(s&&Object.keys(s).length) daily[dates[i]]=s; });
  if(!Object.keys(daily).length){ const rn=await fetchRows(CONFIG.sheets.now,true); const s=statsFromRows(rn,CONFIG.sheets.now,true); daily[dates[dates.length-1]]=s; }
  const subs={}; if(rSubs) for(const r of rSubs.slice(1)){ const id=normId(r[0]); if(id) subs[id]={name:(r[1]||'').trim(),mainId:normId(r[2]),mainName:(r[3]||'').trim()}; }
  const ds=Object.keys(daily).sort(), now=daily[ds[ds.length-1]], snaps={k19,k20,now};
  const ids=new Set(); Object.values(snaps).forEach(d=>Object.keys(d).forEach(id=>ids.add(id))); ds.forEach(dt=>Object.keys(daily[dt]).forEach(id=>ids.add(id)));
  [a19,a20].forEach(d=>Object.keys(d).forEach(id=>ids.add(id)));
  const accounts=[];
  for(const id of ids){
    const src=now[id]||k20[id]||k19[id]||a20[id]||a19[id]||daily[ds.find(dt=>daily[dt][id])]?.[id];
    const acc={id,name:src.name,type:subs[id]?'sub':'main'};
    if(a19[id]) acc.a19={p:a19[id].p,max:a19[id].max}; if(a20[id]) acc.a20={p:a20[id].p,max:a20[id].max};
    if(subs[id]){ acc.mainId=subs[id].mainId; acc.mainName=subs[id].mainName; }
    for(const k in snaps) if(snaps[k][id]) acc[k]=snaps[k][id];
    acc.h={}; for(const dt of ds) if(daily[dt][id]) acc.h[dt]=daily[dt][id].p;
    accounts.push(acc);
  }
  return { snapshots:[{key:'k19',label:'KVK19',period:CONFIG.periods.k19},{key:'k20',label:'KVK20',period:CONFIG.periods.k20},{key:'now',label:'現在',period:fmtDate(ds[ds.length-1])}], accounts, dates:ds, subCount:accounts.filter(a=>a.type==='sub').length, source:`Googleスプレッドシート（${loaded}、日付シート ${ds.join(', ')}）`, warn };
}

// ---------- 共通 ----------
const inKvk=a=>!!(a.k19||a.k20);
// 判定: 現在戦力 − そのKVK時点の戦力（表の「KVK19→現在」列と同じ）
const base=(a,k)=>a[k].p;
function judge(a,from,to,tol){ if(!a[from]) return 'na'; if(!a[to]) return 'absent'; const d=a[to].p-base(a,from); return Math.abs(d)<=tol?'flat':(d<0?'down':'up'); }

const pill=s=>`<span class="pill ${s}">${PILL[s]}</span>`;
function seg(id,onChange){ const el=$(id); el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); onChange(); });
  return { get:()=>el.querySelector('[aria-pressed="true"]').dataset.v, reset:()=>el.querySelectorAll('button').forEach((x,i)=>x.setAttribute('aria-pressed',i===0)) }; }
function downloadCSV(name,header,rows){
  const esc=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+[header,...rows].map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv'})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
const tol=()=>Math.max(0,+$('#fTol').value||0)*MAN;
const deltaCell=(v,cls,title)=>v==null?'<td class="num delta flat">—</td>':`<td class="num delta ${cls||(Math.abs(v)<=tol()?'flat':(v<0?'down':'up'))}" title="${title||fmtD(v)}">${fmtSD(v)}</td>`;
const numCell=(v,extra)=>v==null?'<td class="num absent-cell">不在</td>':`<td class="num ${extra||''}">${fmt(v)}</td>`;

// ---------- 列定義 ----------
// group: ヘッダ上段のグループ名。sum: フッター合計の取り方
function kvkCols(k){
  const L=k==='k19'?'KVK19':'KVK20';
  const tt=a=>a[k]?`現在 ${fmt(a.now?a.now.p:'')} − ${L}戦力 ${fmt(a[k].p)}（${L}最高 ${fmt(a[k].max)}、出典 ${a[k].src==='base'?L+'base':L}）`:'';
  return [
    {key:k+'_dm',group:L,label:L+'→現在',cls:'gl',cell:a=>a[k]&&a.now?deltaCell(a.now.p-a[k].p,null,tt(a)).replace('<td class="','<td class="gl '):(a[k]?'<td class="gl num delta flat" title="現在不在">—</td>':'<td class="gl num absent-cell">不在</td>'),sort:a=>a[k]&&a.now?a.now.p-a[k].p:null,sum:a=>a[k]&&a.now?a.now.p-a[k].p:undefined,csv:a=>a[k]&&a.now?a.now.p-a[k].p:(a[k]?'':'不在')},
    {key:k+'_kp',group:L,label:'撃破pt',cell:a=>a[k]?(a[k].kp==null?`<td class="num delta flat" title="${L}シート（期間統計）にIDが無い">—</td>`:`<td class="num ${a[k].kp===0?'zero':''}" title="撃破pt ${fmt(a[k].kp)}（T5 ${fmt(a[k].k5)} / T4 ${fmt(a[k].k4)}）">${fmtS(a[k].kp)}</td>`):'<td class="num absent-cell">—</td>',sort:a=>a[k]?.kp??null,sum:a=>a[k]?.kp,csv:a=>a[k]?.kp??''},
    {key:k+'_dead',group:L,label:'戦死',cell:a=>a[k]?(a[k].dead==null?'<td class="num delta flat">—</td>':`<td class="num" title="戦死(T4+T5) ${fmt(a[k].dead)}">${fmtS(a[k].dead)}</td>`):'<td class="num absent-cell">—</td>',sort:a=>a[k]?.dead??null,sum:a=>a[k]?.dead,csv:a=>a[k]?.dead??''},
  ];
}
// 最低戦力: KVK19戦力 / KVK20戦力 / 現在戦力 のうち一番低い時点
const LOWL={k19:'KVK19',k20:'KVK20',now:'現在'};
// 同値なら 現在 > KVK20 > KVK19 の順で優先
function lowest(a){ let k=null,v=null; for(const s of ['now','k20','k19']) if(a[s]&&(v==null||a[s].p<v)){k=s;v=a[s].p;} return k; }
function buildColumns(){
  const cols=[
    {key:'name',group:'',label:'名前',cell:a=>`<td class="name" title="${a.name.replace(/"/g,'&quot;')}">${a.name}</td>`,sort:a=>a.name,csv:a=>a.name},
    {key:'id',group:'',label:'ID',cell:a=>`<td class="id">${a.id}</td>`,sort:a=>+a.id,csv:a=>a.id},
    {key:'type',group:'',label:'区分',cell:a=>`<td><span class="pill ${a.type}">${a.type==='sub'?'サブ':'メイン'}</span></td>`,sort:a=>a.type,csv:a=>a.type==='sub'?'サブ':'メイン'},
    {key:'main',group:'',label:'メイン',cell:a=>`<td class="sub-of" title="${a.mainName||''} ${a.mainId||''}">${a.type==='sub'?(a.mainName||a.mainId||''):''}</td>`,sort:a=>a.mainName||'',csv:a=>a.type==='sub'?`${a.mainName||''} (${a.mainId||''})`:''},
    {key:'low',group:'現在',label:'最低',cls:'gl',cell:a=>{const k=lowest(a); if(!k) return '<td class="gl"></td>'; const d=(k!=='now'&&a.now)?a.now.p-a[k].p:null;
      return `<td class="gl"><span class="pill ${k==='now'?'down':'flat'}" title="最低: ${LOWL[k]} ${fmt(a[k].p)}">${LOWL[k]}</span>${d!=null?` <span class="delta up lowd" title="現在 − 最低 = ${fmtD(d)}">${fmtSD(d)}</span>`:''}</td>`;},sort:a=>({now:0,k20:1,k19:2})[lowest(a)]??9,csv:a=>LOWL[lowest(a)]||''},
    {key:'now_p',group:'現在',label:'戦力',cell:a=>a.now?`<td class="num"><b>${fmt(a.now.p)}</b></td>`:'<td class="num absent-cell">不在</td>',sort:a=>a.now?.p??null,sum:a=>a.now?.p,csv:a=>a.now?a.now.p:'不在'},
    ...kvkCols('k19'),...kvkCols('k20'),
  ];
  const dates=DATA.dates||[];
  if(dates.length>1&&$('#fDaily').checked){
    const f=dates[0], l=dates[dates.length-1];
    dates.slice(1).forEach((dt,j)=>{ const prev=dates[j];
      cols.push({key:'h'+dt,group:'日別（前日比）',label:fmtDate(dt).slice(5),cls:j===0?'gl':'',
        cell:a=>{ const h=a.h||{}; const g=j===0?'gl ':'';
          if(h[dt]==null) return `<td class="${g}num absent-cell">不在</td>`;
          if(h[prev]==null) return `<td class="${g}num delta flat" title="${fmtDate(dt)} ${fmt(h[dt])}（前日 不在）">—</td>`;
          const d=h[dt]-h[prev], cls=Math.abs(d)<=tol()?'flat':(d<0?'down':'up');
          return `<td class="${g}num delta ${cls}" title="${fmtDate(dt)} ${fmt(h[dt])} − ${fmtDate(prev)} ${fmt(h[prev])} = ${fmtD(d)}">${fmtSD(d)}</td>`; },
        sort:a=>{const h=a.h||{};return (h[dt]!=null&&h[prev]!=null)?h[dt]-h[prev]:null;},
        sum:a=>{const h=a.h||{};return (h[dt]!=null&&h[prev]!=null)?h[dt]-h[prev]:undefined;},
        csv:a=>{const h=a.h||{};return (h[dt]!=null&&h[prev]!=null)?h[dt]-h[prev]:(h[dt]==null?'不在':'');}}); });
    cols.push({key:'hsum',group:'日別（前日比）',label:`累計 ${fmtDate(f).slice(5)}→${fmtDate(l).slice(5)}`,cell:a=>{const h=a.h||{};return deltaCell(h[f]!=null&&h[l]!=null?h[l]-h[f]:null,null,h[f]!=null&&h[l]!=null?`${fmtDate(l)} ${fmt(h[l])} − ${fmtDate(f)} ${fmt(h[f])} = ${fmtD(h[l]-h[f])}`:'');},sort:a=>{const h=a.h||{};return h[f]!=null&&h[l]!=null?h[l]-h[f]:null;},sum:a=>{const h=a.h||{};return h[f]!=null&&h[l]!=null?h[l]-h[f]:undefined;},csv:a=>{const h=a.h||{};return h[f]!=null&&h[l]!=null?h[l]-h[f]:'';}});
  }
  return cols;
}

// ---------- テーブル ----------
let sortKey='now_p', sortDir=-1, lastRows=[], COLS=[];
const table=$('#table');
table.addEventListener('click',e=>{ const th=e.target.closest('th[data-key]'); if(!th) return; const k=th.dataset.key; if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=-1; } renderTable(); });
function renderTable(){
  COLS=buildColumns();
  const col=COLS.find(c=>c.key===sortKey)||COLS[4];
  const rows=[...lastRows].sort((a,b)=>{ const x=col.sort(a), y=col.sort(b);
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return (typeof x==='string'?x.localeCompare(y,'ja'):x-y)*sortDir; });
  // グループ行
  const groups=[]; COLS.forEach(c=>{ const g=groups[groups.length-1]; if(g&&g.name===c.group) g.n++; else groups.push({name:c.group,n:1,gl:c.cls==='gl'}); });
  const grpRow='<tr class="grp">'+groups.map(g=>`<th colspan="${g.n}" class="${g.gl?'gl':''}">${g.name}</th>`).join('')+'</tr>';
  const colRow='<tr class="col">'+COLS.map(c=>`<th data-key="${c.key}" class="${c.cls||''} ${c.sum||/_p$|_max$|_dp$|_dm$|_kp$|_dead$|^h/.test(c.key)?'num':''}" aria-sort="${sortKey===c.key?(sortDir>0?'ascending':'descending'):'none'}">${c.label}</th>`).join('')+'</tr>';
  const body=rows.length?'<tbody>'+rows.map(a=>'<tr>'+COLS.map(c=>c.cell(a)).join('')+'</tr>').join('')+'</tbody>':`<tbody><tr><td colspan="${COLS.length}" class="empty">該当なし</td></tr></tbody>`;
  // 合計
  const foot='<tfoot><tr>'+COLS.map((c,i)=>{ if(i===0) return `<td>合計 ${fmt(rows.length)} 件</td>`; if(!c.sum) return `<td class="${c.cls||''}"></td>`;
    let s=0,n=0; rows.forEach(a=>{const v=c.sum(a); if(v!=null){s+=v;n++;}}); const isD=/_dp$|_dm$|hsum|^h\d{8}$/.test(c.key);
    const short=c.key!=='now_p'; return `<td class="num ${c.cls||''} ${isD?'delta '+(s<0?'down':s>0?'up':'flat'):''}" title="${n}件の合計: ${isD?fmtD(s):fmt(s)}">${isD?(short?fmtSD(s):fmtD(s)):(short?fmtS(s):fmt(s))}</td>`; }).join('')+'</tr></tfoot>';
  table.innerHTML='<thead>'+grpRow+colRow+'</thead>'+body+foot;
}

const S={low:seg('#fLow',apply),type:seg('#fType',apply),kill19:seg('#fKill19',apply),kill20:seg('#fKill20',apply),ch19:seg('#fCh19',apply),ch20:seg('#fCh20',apply)};
const val=id=>{ const v=$(id).value.trim(); return v===''?null:(+v)*MAN; };
function apply(){
  const type=S.type.get(), k19m=S.kill19.get(), k20m=S.kill20.get(), c19=S.ch19.get(), c20=S.ch20.get(), t=tol();
  const topN=+$('#fTopN').value||0, scope=$('#fScope').checked, showAbsent=$('#fShowNowAbsent').checked, q=$('#fSearch').value.trim().toLowerCase();
  const r={now:[val('#fNowMin'),val('#fNowMax')],k19:[val('#f19Min'),val('#f19Max')],k20:[val('#f20Min'),val('#f20Max')]};
  const inRange=(a,k)=>{ const [lo,hi]=r[k]; if(lo==null&&hi==null) return true; if(!a[k]) return false; return (lo==null||a[k].p>=lo)&&(hi==null||a[k].p<=hi); };
  const killF=(a,k,m)=>m==='all'||(a[k]&&a[k].kp!=null&&(m==='zero'?a[k].kp===0:a[k].kp>0));
  const chF=(a,k,m)=>m==='all'||judge(a,k,'now',t)===m;
  const lowM=S.low.get();
  let rows=DATA.accounts.filter(a=>(type==='all'||a.type===type)&&(lowM==='all'||lowest(a)===lowM)&&(!scope||inKvk(a))&&(showAbsent||a.now)
    &&inRange(a,'now')&&inRange(a,'k19')&&inRange(a,'k20')&&killF(a,'k19',k19m)&&killF(a,'k20',k20m)&&chF(a,'k19',c19)&&chF(a,'k20',c20)
    &&(!q||a.name.toLowerCase().includes(q)||a.id.includes(q)||(a.mainName||'').toLowerCase().includes(q)||(a.mainId||'').includes(q)));
  if(topN>0){ rows=rows.filter(a=>a.now).sort((a,b)=>b.now.p-a.now.p).slice(0,topN); }
  lastRows=rows;
  const cnt=(k,s)=>rows.filter(a=>judge(a,k,'now',t)===s).length, sum=f=>rows.reduce((s,a)=>s+(f(a)||0),0);
  const subs=rows.filter(a=>a.type==='sub').length;
  $('#summary').innerHTML=`<span>表示 <b>${rows.length}</b> 件（メイン <b>${rows.length-subs}</b> / サブ <b>${subs}</b>）</span>`+
    `<span>現在戦力 合計 <b>${fmt(sum(a=>a.now?.p))}</b></span>`+
    `<span>KVK19→現在: ${pill('down')} <b>${cnt('k19','down')}</b> ${pill('up')} <b>${cnt('k19','up')}</b> ${pill('flat')} <b>${cnt('k19','flat')}</b> ${pill('absent')} <b>${cnt('k19','absent')}</b> 合計差 <b class="delta ${sum(a=>a.k19&&a.now?a.now.p-a.k19.p:0)<0?'down':'up'}">${fmtSD(sum(a=>a.k19&&a.now?a.now.p-a.k19.p:0))}</b></span>`+
    `<span>KVK20→現在: ${pill('down')} <b>${cnt('k20','down')}</b> ${pill('up')} <b>${cnt('k20','up')}</b> ${pill('flat')} <b>${cnt('k20','flat')}</b> ${pill('absent')} <b>${cnt('k20','absent')}</b> 合計差 <b class="delta ${sum(a=>a.k20&&a.now?a.now.p-a.k20.p:0)<0?'down':'up'}">${fmtSD(sum(a=>a.k20&&a.now?a.now.p-a.k20.p:0))}</b></span>`+
    `<span>撃破0: KVK19 <b>${rows.filter(a=>a.k19&&a.k19.kp===0).length}</b> / KVK20 <b>${rows.filter(a=>a.k20&&a.k20.kp===0).length}</b></span>`+
    `<span>最低が現在 <b>${rows.filter(a=>lowest(a)==='now').length}</b></span><span>現在不在 <b>${rows.filter(a=>!a.now).length}</b></span>`;
  renderTable();
}
['#fTopN','#fNowMin','#fNowMax','#f19Min','#f19Max','#f20Min','#f20Max','#fSearch','#fTol','#fScope','#fShowNowAbsent','#fDaily'].forEach(s=>$(s).addEventListener('input',apply));
$('#btnReset').addEventListener('click',()=>{ Object.values(S).forEach(s=>s.reset()); ['#fTopN','#fNowMin','#fNowMax','#f19Min','#f19Max','#f20Min','#f20Max','#fSearch'].forEach(s=>$(s).value=''); $('#fTol').value=CONFIG.defaultTolerance; $('#fScope').checked=true; $('#fShowNowAbsent').checked=true; sortKey='now_p'; sortDir=-1; apply(); });

function renderKingdom(){
  const N=300;
  const L={k19:'KVK19マッチング',a19:'KVK19後',k20:'KVK20マッチング',a20:'KVK20後',now:'現在'};
  const SUB={k19:CONFIG.sheets.k19base,a19:CONFIG.sheets.a19,k20:CONFIG.sheets.k20base,a20:CONFIG.sheets.a20,now:DATA.snapshots[2].period};
  const snaps=['k19','a19','k20','a20','now'].filter(k=>DATA.accounts.some(a=>a[k]));
  const P={}; snaps.forEach(k=>P[k]=DATA.accounts.filter(a=>a[k]).map(a=>a[k].p).sort((x,y)=>y-x));
  const total=k=>P[k].reduce((s,v)=>s+v,0), top=k=>P[k].slice(0,N).reduce((s,v)=>s+v,0), cnt=k=>P[k].length, nth=k=>P[k][N-1]??null;
  const cmp=snaps.filter(k=>k!=='now');
  const dcell=(v,short=true)=>`<td class="num delta ${v<0?'down':v>0?'up':'flat'}" title="${fmtD(v)}">${short?fmtSD(v):fmtD(v)}</td>`;
  const row=(label,f,short=true)=>`<tr><th>${label}</th>${snaps.map(k=>`<td class="num ${k==='now'?'gl':''}" title="${fmt(f(k))}">${k==='now'?'<b>':''}${short?fmtS(f(k)):fmt(f(k))}${k==='now'?'</b>':''}</td>`).join('')}${cmp.map((k,i)=>dcell(f('now')-f(k),short).replace('<td class="','<td class="'+(i===0?'gl ':''))).join('')}</tr>`;
  $('#kingdom').innerHTML=`<thead><tr class="col"><th></th>${snaps.map(k=>`<th class="num ${k==='now'?'gl':''}">${L[k]}<br><span style="font-weight:400;color:var(--muted)">${SUB[k]}</span></th>`).join('')}${cmp.map((k,i)=>`<th class="num ${i===0?'gl':''}">${L[k]}→現在</th>`).join('')}</tr></thead><tbody>`+
    row('総戦力',total)+row(`TOP${N} 戦力`,top)+row(`${N}位の戦力`,nth)+row('アカウント数',cnt,false)+'</tbody>';
}
